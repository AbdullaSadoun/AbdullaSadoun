name: Deploy to GitHub Pages

on:
  push:
    branches:
      - React-app  # Changed to match your development branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Copy CNAME
        run: |
          if [ ! -f dist/CNAME ]; then
            echo "www.asadoun.com" > dist/CNAME
          fi

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages 